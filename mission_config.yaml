# ── Drone Mission Configuration ──────────────────

flight:
  takeoff_altitude: 10.0       # metres above home (relative altitude)
  speed: 3.0                   # metres per second
  waypoint_hold_time: 2.0      # seconds to hover at each waypoint
  waypoint_threshold: 1.5      # metres — how close = "arrived"
  loiter_time: 3.0             # seconds to stabilize after takeoff
  return_home: true            # true = fly back to home before landing

# Waypoints in GPS coordinates (latitude, longitude, altitude in metres)
# Default SITL home is lat: -35.3609403, lon: 149.1680841
# Each degree of latitude ≈ 111,000 metres
# Each degree of longitude ≈ 89,000 metres at this location
waypoints:
  - {lat: -35.3604, lon: 149.1680, alt: 10.0, yaw:   0.0, speed: 3.0, hold_time: 2.0}  # WP1 — North
  - {lat: -35.3604, lon: 149.1690, alt: 10.0, yaw:  90.0, speed: 2.0, hold_time: 3.0}  # WP2 — North-East
  - {lat: -35.3609, lon: 149.1690, alt: 10.0, yaw: 180.0, speed: 3.0, hold_time: 2.0}  # WP3 — East
  - {lat: -35.3614, lon: 149.1685, alt: 10.0, yaw: 270.0, speed: 2.0, hold_time: 4.0}  # WP4 — South
  - {lat: -35.3609, lon: 149.1680, alt: 10.0, yaw:   0.0, speed: 3.0, hold_time: 2.0}  # WP5 — Back near home
